name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk TraductionInstantanee.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TraductionInstantanee
          path: TraductionInstantanee.apk

      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Traduction Instantanée (dernière version)
          prerelease: false
          make_latest: true
          target_commitish: ${{ github.sha }}
          body: |
            Téléchargez **TraductionInstantanee.apk** ci-dessous depuis votre téléphone Android, puis ouvrez-le pour l'installer.
            Version construite depuis le commit ${{ github.sha }}.
          files: TraductionInstantanee.apk
